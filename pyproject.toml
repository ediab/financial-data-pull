[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-data-pull"
version = "0.1.0"
description = "Pull a ticker's financial data from SEC EDGAR, Alpha Vantage and Yahoo, and cache it locally and immutably."
requires-python = ">=3.10"
# Direct dependencies are pinned, including the Parquet engine: the code reads and
# writes Parquet and parses spreadsheet XML, so an unpinned engine is a silent
# correctness risk, not an implementation detail.
dependencies = [
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "edgartools==5.58.0",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
# Needed only to build and inspect distributions (scripts/check_dist_contents.py).
dev = [
    "build",
]

[project.scripts]
financial-data-pull = "financial_data_pull.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_data_pull"]

# The JSON contracts are the single source of truth at the repository root; the
# wheel carries them inside the package so an installed copy can validate without
# a source checkout (see contracts.SCHEMA_DIR).
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "financial_data_pull/schemas"

[tool.hatch.build.targets.sdist]
# Private planes are excluded by name as well as by .gitignore: a distribution must
# never carry company data, supplied documents, case state or credentials.
exclude = [
    "/data",
    "/.env",
    "/.venv",
    "/tests",
    "/docs",
]
